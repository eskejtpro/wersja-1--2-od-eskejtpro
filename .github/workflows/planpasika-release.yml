name: PlanPasika release gates

on:
  push:
    branches: [main, codex/planpasika-release]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: planpasika-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix ops-agent
      - run: npm run lint
      - run: npm test
      - run: npm run test:update
      - run: npm run test:server
      - run: npm run test:cloud
      - run: npm run test:ai-transport
      - run: npm run test:google-ui
      - run: node --test tests/android-package-security.test.mjs
      - run: npm run test:ai-model-registry
      - run: npm run test:ops-agent
      - run: npm run build:ops-agent
      - run: npm run build

  android-debug:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_WEB_CLIENT_ID: 761415655121-40dq7naiqar13bochgqtvgtvnsrfv2nd.apps.googleusercontent.com
      VITE_GYMTRACKER_SERVER_URL: https://wersja-1--2-od-eskejtpro-git-761415655121.europe-central2.run.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: node scripts/verify-android-oauth-bundle.mjs
      - uses: gradle/actions/setup-gradle@v4
      - run: bash android/gradlew -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - run: node scripts/verify-android-package-security.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ci-test-only-android-debug-ephemeral-signature-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
