// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Capacitor/Cordova plugins can bring older split Kotlin stdlib artifacts
    // into the androidTest classpath. Keep all Kotlin modules on one version
    // so AGP's duplicate-class check remains deterministic.
    configurations.configureEach {
        resolutionStrategy.eachDependency { dependency ->
            if (dependency.requested.group == 'org.jetbrains.kotlin') {
                dependency.useVersion '1.8.22'
                dependency.because 'Align Kotlin stdlib modules for Android test packaging'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
